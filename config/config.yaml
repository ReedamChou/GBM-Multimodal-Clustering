# ============================================================================
# GBM Multi-Modal Clustering Pipeline — Master Configuration
# ============================================================================
# All paths are relative to the project root unless stated otherwise.
# ============================================================================

project:
  name: "GBM Multi-Modal Clustering"
  seed: 42

# ── Data paths ──────────────────────────────────────────────────────────────
paths:
  dataset_root: "Dataset"

  ucsf:
    clinical_csv: "Dataset/UCSF-PDGM-metadata_v5.csv"
    structural_dir: "Dataset/UCSF/DATA-IMAGE-STRUCTURAL"
    segmentation_dir: "Dataset/UCSF/DATA-AUTOMATED-SEGMENT"

  upenn:
    clinical_csv: "Dataset/UPENN-GBM_clinical_info_v2.1.csv"
    structural_dir: "Dataset/UPenn/DATA-IMAGE-STRUCTURAL"
    segmentation_dir: "Dataset/UPenn/DATA-AUTOMATED-SEGMENT"

  # Generated artefacts
  output:
    data_dir: "data"
    results_dir: "results"
    figures_dir: "results/figures"
    tables_dir: "results/tables"

# ── Preprocessing ───────────────────────────────────────────────────────────
preprocessing:
  modalities: ["T1", "T1GD", "T2", "FLAIR"]
  segmentation_labels:
    NCR_NET: 1      # Necrotic / Non-Enhancing Tumour core
    ED: 2           # Peritumoral Edematous / Invaded tissue
    ET: 4           # GD-Enhancing Tumour
  atlas: "MNI152"          # ANTsPy built-in atlas name
  registration_type: "SyN" # deformable registration
  n_jobs: 4                # parallel workers for radiomics

# ── Radiomics ──────────────────────────────────────────────────────────────
radiomics:
  bin_width: 25
  resample_spacing: [1, 1, 1]
  feature_classes:
    - firstorder
    - shape
    - glcm
    - glrlm
    - glszm
    - gldm

# ── Feature engineering ────────────────────────────────────────────────────
features:
  variance_threshold: 0.01
  correlation_threshold: 0.95
  n_components_pca: 50       # initial PCA before clustering

# ── Clustering ─────────────────────────────────────────────────────────────
clustering:
  k_range: [2, 3, 4, 5, 6, 7, 8]
  algorithms:
    - spectral
    - gmm
    - agglomerative
    - kmedoids
  consensus:
    n_iterations: 100
    subsample_fraction: 0.8

# ── Survival analysis ─────────────────────────────────────────────────────
survival:
  alpha: 0.05              # significance level for log-rank
  cox_penalizer: 0.1       # L2 penalizer for Cox PH

# ── Visualization ──────────────────────────────────────────────────────────
visualization:
  dpi: 300
  figure_format: "pdf"
  palette: "Set2"
  umap:
    n_neighbors: 15
    min_dist: 0.1
    metric: "euclidean"
